name: Build

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so a newly published advisory fails here instead of in an unrelated pull request.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build (warnings are errors)
        run: npm run build

      - name: Test
        run: npm run test:ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
